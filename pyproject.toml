[project]
name = "mlit-dpf-mcp"
version = "0.1.0"
description = "MCP server for MLIT (MLIT Data Platform wrapper)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }

dependencies = [
  "aiohttp>=3.9",
  "pydantic>=2.7",
  "tenacity>=8.2",
  "python-json-logger>=2.0",
  "mcp>=1.8",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
